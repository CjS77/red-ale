# cargo-nextest runs each test in its own process. It does not run doctests; `cargo test --doc --workspace` does.

[profile.default]
# The oracle tests start GnuCash and can take a while; flag them as slow, never kill them.
slow-timeout = { period = "60s" }

[profile.ci]
# Report every failure in one run, not just the first.
fail-fast = false
failure-output = "immediate-final"
# A test still running after 5 minutes is stuck (the slowest takes about 90 seconds in debug): end it as a failure.
slow-timeout = { period = "60s", terminate-after = 5 }

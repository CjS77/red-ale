# Every dependency must be compatible with red-ale's GPL-3.0-or-later licence.

[graph]
all-features = true

[licenses]
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[advisories]
yanked = "deny"
ignore = [
    # smartstring is unmaintained (archived 2026-05-03), not vulnerable. Rhai, the report engine, depends on it
    # unconditionally; its compact_str feature does not remove it. Revisit when Rhai drops it.
    { id = "RUSTSEC-2026-0249", reason = "unmaintained, no vulnerability; a non-optional dependency of rhai" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[workspace]
members = [
    "crates/red-ale",
    "crates/red-ale-core",
    "crates/red-ale-docs",
    "crates/red-ale-export",
    "crates/red-ale-import",
    "crates/red-ale-locale",
    "crates/red-ale-mcp",
    "crates/red-ale-quotes",
    "crates/red-ale-report",
    "crates/red-ale-rpc",
    "crates/red-ale-service",
    "crates/red-ale-setup",
    "crates/red-ale-sql",
    "crates/red-ale-testkit",
    "crates/red-ale-xml",
]
# Fuzz targets build with nightly and libFuzzer, outside the workspace (design/testing.md, "Fuzzing").
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.98.0"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
getrandom = "0.3"
http-body-util = "0.1.3"
hyper = { version = "1.5", default-features = false, features = ["client", "http1"] }
# HTTPS for Quote fetches, with ring as rustls's only crypto provider (design/architecture.md, "Dependencies").
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring"] }
hyper-util = { version = "0.1.19", default-features = false, features = ["client-legacy", "http1", "tokio"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
icu_calendar = { version = "2.4", default-features = false, features = ["compiled_data"] }
# `range` (date intervals) is behind `unstable`, whose API may change in a minor release: pinned exactly.
icu_datetime = { version = "=2.4.0", default-features = false, features = ["compiled_data", "unstable"] }
icu_locale_core = "2.4"
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
indexmap = "2.14"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
# Harness configs edited through a syntax tree that keeps their text (design/setup.md, "Editing a Harness config").
jsonc-parser = { version = "0.34.0", features = ["cst", "serde_json"] }
jsonrpsee = { version = "0.25", features = ["server", "http-client", "macros"] }
num-bigint = "0.4.6"
num-integer = "0.1.46"
num-rational = "0.4.2"
num-traits = "0.2.19"
peak_alloc = "0.3.0"
proptest = "1.9"
# Markdown for the Manual (design/manual.md); the static site adds the `html` feature.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
quick-xml = "0.41"
regex = "1.12"
rhai = { version = "1.27.0", default-features = false, features = ["std", "no_float", "no_time", "serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
# SQLite books, with SQLite compiled in so its version is pinned (design/sql-fidelity.md §10).
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "backup"] }
# The host name for the SQLite lock row, as `gethostname` gives it, without unsafe code (design/sql-fidelity.md §10).
rustix = { version = "1.1.5", default-features = false, features = ["std", "system"] }
rmcp = { version = "3.7", default-features = false, features = ["server", "transport-io"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_path_to_error = "0.1.20"
# The diffs `red-ale setup` shows before it changes a Harness config.
similar = { version = "2.7.0", default-features = false, features = ["text"] }
tempfile = "3.24"
thiserror = "2.0"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "signal"] }
# Codex's config.toml, read only by `red-ale setup` to plan.
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
writeable = "0.6"

red-ale-core = { path = "crates/red-ale-core" }
red-ale-docs = { path = "crates/red-ale-docs" }
red-ale-export = { path = "crates/red-ale-export" }
red-ale-import = { path = "crates/red-ale-import" }
red-ale-locale = { path = "crates/red-ale-locale" }
red-ale-mcp = { path = "crates/red-ale-mcp" }
red-ale-quotes = { path = "crates/red-ale-quotes" }
red-ale-report = { path = "crates/red-ale-report" }
red-ale-rpc = { path = "crates/red-ale-rpc" }
red-ale-service = { path = "crates/red-ale-service" }
red-ale-setup = { path = "crates/red-ale-setup" }
red-ale-sql = { path = "crates/red-ale-sql" }
red-ale-testkit = { path = "crates/red-ale-testkit" }
red-ale-xml = { path = "crates/red-ale-xml" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"
# The project prefers iterator chains to `for` loops.
needless_for_each = "allow"
